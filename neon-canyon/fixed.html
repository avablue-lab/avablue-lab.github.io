<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Canyon · 2AM</title>
<style>
  html,body{margin:0;height:100%;background:#05010c;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Neon Canyon: a software 3D endless runner. No libraries: a hand-rolled
// perspective projection onto a 2D canvas, painter's algorithm, flat shading.
// ---------------------------------------------------------------------------
const cv = document.getElementById('c');
const g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, F0 = 1, F = 1, CX = 0, CY = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.floor(innerWidth * DPR);
  H = Math.floor(innerHeight * DPR);
  cv.width = W; cv.height = H;
  F0 = Math.min(H * 0.95, W * 0.8);
  CX = W / 2; CY = H * 0.42;
}
addEventListener('resize', resize);
resize();

// ---- world constants ------------------------------------------------------
const SEG = 4;            // metres per road segment
const NSEG = 130;         // draw distance in segments
const HALF = 7;           // road half width
const CAR_AHEAD = 6.5;    // car rear, metres in front of the camera
const CAR_LEN = 4.4;
const CAM_H = 2.5;
const NEAR = 0.35;
const FOG = [26, 8, 38];
const LM = (() => { const v = [-0.45, 0.55, 0.7], l = Math.hypot(...v); return v.map(x => x / l); })();

function roadX(d)  { return 22 * Math.sin(d * 0.0037) + 10 * Math.sin(d * 0.0102 + 1.3) + 4 * Math.sin(d * 0.023 + 0.4); }
function roadDX(d) { return 22 * 0.0037 * Math.cos(d * 0.0037) + 10 * 0.0102 * Math.cos(d * 0.0102 + 1.3) + 4 * 0.023 * Math.cos(d * 0.023 + 0.4); }
function roadY(d)  { return 3 * Math.sin(d * 0.0051) + 1.6 * Math.sin(d * 0.0137 + 2.0); }
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i) * (1 - u) + hash(i + 1) * u; }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function col(r, gr, b, f) {
  return 'rgb(' + ((r + (FOG[0] - r) * f) | 0) + ',' + ((gr + (FOG[1] - gr) * f) | 0) + ',' + ((b + (FOG[2] - b) * f) | 0) + ')';
}
function rgba(r, gr, b, a) { return 'rgba(' + (r | 0) + ',' + (gr | 0) + ',' + (b | 0) + ',' + a.toFixed(3) + ')'; }

// ---- camera ---------------------------------------------------------------
let pos = 0, camX = 0, camY = 0, camS = 0;
function view(wx, wy, d) { const z = d - pos; return [wx - camX - camS * z, wy - camY, z]; }

// ---- meshes -----------------------------------------------------------------
const PHI = (1 + Math.sqrt(5)) / 2;
const ICO_V = [[-1,PHI,0],[1,PHI,0],[-1,-PHI,0],[1,-PHI,0],[0,-1,PHI],[0,1,PHI],[0,-1,-PHI],[0,1,-PHI],[PHI,0,-1],[PHI,0,1],[-PHI,0,-1],[-PHI,0,1]];
const ICO_F = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
function makeRock(r) {
  const rot = Math.random() * Math.PI * 2, c = Math.cos(rot), s = Math.sin(rot);
  const flat = 0.6 + Math.random() * 0.35;
  let minY = Infinity;
  const v = ICO_V.map(p => {
    const l = Math.hypot(p[0], p[1], p[2]);
    const k = r * (0.72 + Math.random() * 0.5) / l;
    const x = p[0] * k, y = p[1] * k * flat, z = p[2] * k;
    const q = [x * c + z * s, y, -x * s + z * c];
    if (q[1] < minY) minY = q[1];
    return q;
  });
  const lift = -minY - r * 0.12;
  v.forEach(p => p[1] += lift);
  return v;
}
const BOX_F = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[3,2,6,7],[0,3,7,4],[1,2,6,5]];
function box(x0, x1, y0, y1, z0, z1, ix, iz) {
  return [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],
          [x0+ix,y1,z0+iz],[x1-ix,y1,z0+iz],[x1-ix,y1,z1-iz],[x0+ix,y1,z1-iz]];
}
const WHEEL = [8, 6, 12], WHEEL_E = [120, 40, 170];
const CAR = [
  { v: box(-1.05,-0.75,0,0.56,3.05,3.8,0,0),  c: WHEEL, e: WHEEL_E },
  { v: box( 0.75, 1.05,0,0.56,3.05,3.8,0,0),  c: WHEEL, e: WHEEL_E },
  { v: box(-1.05,-0.75,0,0.56,0.45,1.2,0,0),  c: WHEEL, e: WHEEL_E },
  { v: box( 0.75, 1.05,0,0.56,0.45,1.2,0,0),  c: WHEEL, e: WHEEL_E },
  { v: box(-1.0, 1.0, 0.22,0.7, 0, CAR_LEN, 0.06,0.25), c: [40,16,80],  e: [255,43,214] },
  { v: box(-0.82,0.82,0.7,1.16, 1.25,3.05, 0.16,0.42),  c: [14,26,52],  e: [46,242,255] },
  { v: box(-0.6,-0.5, 0.7,0.98, 0.1,0.25, 0,0),         c: [30,10,50],  e: [255,43,214] },
  { v: box( 0.5, 0.6, 0.7,0.98, 0.1,0.25, 0,0),         c: [30,10,50],  e: [255,43,214] },
  { v: box(-0.98,0.98,0.98,1.05, -0.05,0.38, 0,0),      c: [70,18,100], e: [255,43,214] },
];

// Flat-shaded convex mesh: back-face cull, sort, fill, neon edges.
// verts are in view space (camera at origin, looking +z).
function drawFaces(vs, faces, c, bc, edge, fog, mode) {
  const list = [];
  for (const f of faces) {
    let bad = false;
    for (const i of f) if (vs[i][2] < NEAR) { bad = true; break; }
    if (bad) continue;
    const a = vs[f[0]], b = vs[f[1]], d = vs[f[2]];
    const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2];
    const wx = d[0]-a[0], wy = d[1]-a[1], wz = d[2]-a[2];
    let nx = uy*wz - uz*wy, ny = uz*wx - ux*wz, nz = ux*wy - uy*wx;
    let mx = 0, my = 0, mz = 0;
    for (const i of f) { mx += vs[i][0]; my += vs[i][1]; mz += vs[i][2]; }
    mx /= f.length; my /= f.length; mz /= f.length;
    if (nx*(mx-c[0]) + ny*(my-c[1]) + nz*(mz-c[2]) < 0) { nx = -nx; ny = -ny; nz = -nz; }
    if (nx*mx + ny*my + nz*mz >= 0) continue;          // facing away from camera
    const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
    const moon = Math.max(0, nx*LM[0] + ny*LM[1] + nz*LM[2]);
    const up = Math.max(0, ny);
    let sh;
    if (mode === 'car') sh = 0.45 + 0.6 * moon + 0.35 * up;
    else {
      const ml = Math.hypot(mx, my, mz) || 1;
      const head = Math.max(0, -(nx*mx + ny*my + nz*mz) / ml) * Math.max(0, 1 - mz / 75);
      sh = 0.2 + 0.55 * moon + 0.85 * head;
    }
    list.push({ f, z: mz, sh, up });
  }
  list.sort((p, q) => q.z - p.z);
  for (const it of list) {
    g.beginPath();
    for (let j = 0; j < it.f.length; j++) {
      const v = vs[it.f[j]], s = F / v[2];
      const x = CX + v[0] * s, y = CY - v[1] * s;
      if (j === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath();
    g.fillStyle = col(bc[0]*it.sh + 70*it.up, bc[1]*it.sh + 18*it.up, bc[2]*it.sh + 95*it.up, fog);
    g.fill();
    if (edge) {
      g.strokeStyle = rgba(edge[0], edge[1], edge[2], (mode === 'car' ? 0.95 : 0.35) * (1 - fog));
      g.lineWidth = (mode === 'car' ? 1.8 : 1) * DPR;
      g.stroke();
    }
  }
}

// ---- game state -------------------------------------------------------------
const car = { lat: 0, vlat: 0, yaw: 0, bob: 0, spin: 0, d: 0 };
let rocks = [], particles = [], popups = [];
let spawnD = 0, speed = 0, score = 0, state = 'ready', crashT = 0, shake = 0, t = 0, playT = 0, scrapeT = 0;
let best = 0;
try { best = +localStorage.getItem('neonCanyonBest') || 0; } catch (e) {}

function spawnRow(decorOnly) {
  const diff = Math.min(1, pos / 7000);
  spawnD += lerp(46, 24, diff) + Math.random() * 16;
  if (!decorOnly) {
    const lanes = [-4.6, 0, 4.6].sort(() => Math.random() - 0.5);
    const n = Math.random() < 0.25 + 0.5 * diff ? 2 : 1;
    for (let i = 0; i < n; i++) {
      const r = 1.05 + Math.random() * 0.7;
      rocks.push({ d: spawnD + (Math.random() - 0.5) * 4, lat: lanes[i] + (Math.random() - 0.5) * 1.6,
                   r, mesh: makeRock(r), hit: true, passed: false });
    }
  }
  if (Math.random() < 0.75) {
    const r = 1.4 + Math.random() * 2.6, side = Math.random() < 0.5 ? -1 : 1;
    rocks.push({ d: spawnD + Math.random() * 12, lat: side * (HALF + 2.5 + r + Math.random() * 4),
                 r, mesh: makeRock(r), hit: false, passed: true });
  }
}

function reset() {
  pos = 0; speed = 32; score = 0; playT = 0;
  car.lat = 0; car.vlat = 0; car.yaw = 0; car.spin = 0;
  rocks = []; particles = []; popups = [];
  spawnD = 110;
  state = 'play'; crashT = 0; shake = 0;
}

function burst(x, y, d, n, colr, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random());
    particles.push({ x, y, d, vx: Math.cos(a) * s, vy: Math.random() * spd * 0.9, vd: Math.sin(a) * s + speed * 0.4,
                     life: 0, max: 0.6 + Math.random() * 1.1, c: colr[(Math.random() * colr.length) | 0], size: 0.06 + Math.random() * 0.12 });
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}

function crash(rock) {
  state = 'crash'; crashT = 0; shake = 1;
  car.spin = (Math.random() < 0.5 ? -1 : 1) * (5 + Math.random() * 3);
  car.vlat = (car.lat - rock.lat) * 3;
  burst(car.lat, 0.8, car.d + CAR_LEN, 90, [[255,60,200],[60,240,255],[255,190,90],[255,255,255]], 9);
  burst(rock.lat, 0.6, rock.d, 40, [[150,80,80],[110,60,70],[200,120,90]], 6);
  const s = Math.floor(score);
  if (s > best) { best = s; try { localStorage.setItem('neonCanyonBest', String(best)); } catch (e) {} }
}

// ---- input ------------------------------------------------------------------
const keys = {};
let touchSteer = 0;
function tryStart() { if (state === 'ready' || (state === 'crash' && crashT > 0.7)) reset(); }
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Space' && !e.repeat) tryStart();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchSteer = 0; });
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { tryStart(); return; }
  touchSteer = (e.clientX < innerWidth / 2) ? -1 : 1;
});
addEventListener('pointerup', () => { touchSteer = 0; });
addEventListener('pointercancel', () => { touchSteer = 0; });

// ---- update -------------------------------------------------------------------
function update(dt) {
  t += dt;
  if (state === 'play') {
    playT += dt;
    speed = Math.min(85, speed + dt * 0.9);
    let steer = 0;
    if (keys.ArrowLeft || keys.KeyA) steer -= 1;
    if (keys.ArrowRight || keys.KeyD) steer += 1;
    if (!steer) steer = touchSteer;
    const target = steer * (10 + speed * 0.08);
    car.vlat += (target - car.vlat) * Math.min(1, dt * 8);
    const curv = roadDX(car.d + 1) - roadDX(car.d);
    car.lat += (car.vlat - curv * speed * speed * 0.15) * dt;
    const lim = HALF - 1.05;
    if (Math.abs(car.lat) > lim) {
      car.lat = Math.sign(car.lat) * lim; car.vlat = 0; speed *= Math.pow(0.6, dt);
      scrapeT += dt;
      if (scrapeT > 0.04) { scrapeT = 0; burst(car.lat + Math.sign(car.lat) * 1.0, 0.3, car.d + 2, 3, [[255,200,90],[255,255,200]], 3); }
    }
    car.yaw = car.vlat * 0.022;
    pos += speed * dt;
    score += speed * dt * 0.1;
  } else if (state === 'crash') {
    crashT += dt;
    speed *= Math.pow(0.08, dt);
    pos += speed * dt;
    car.yaw += car.spin * dt; car.spin *= Math.pow(0.15, dt);
    car.lat = clamp(car.lat + car.vlat * dt, -HALF + 1, HALF - 1); car.vlat *= Math.pow(0.1, dt);
    if (Math.random() < dt * 20) burst(car.lat, 1.0, car.d + 3.5, 1, [[90,70,110],[60,50,80]], 1.2);
  } else {
    speed = 22; pos += speed * dt;
    car.lat = Math.sin(t * 0.5) * 2.2; car.vlat = Math.cos(t * 0.5) * 1.1; car.yaw = car.vlat * 0.05;
  }
  car.d = pos + CAR_AHEAD;
  car.bob = Math.sin(t * 23) * 0.012 * (speed / 50);

  while (spawnD < pos + NSEG * SEG) spawnRow(state !== 'play');
  rocks = rocks.filter(r => r.d > pos - 3);

  if (state === 'play') {
    const cc = car.d + CAR_LEN / 2;
    for (const r of rocks) {
      if (!r.hit) continue;
      if (Math.abs(r.d - cc) < CAR_LEN / 2 + r.r * 0.7 && Math.abs(r.lat - car.lat) < r.r * 0.8 + 0.92) { crash(r); break; }
      if (!r.passed && r.d < car.d) {
        r.passed = true;
        if (Math.abs(r.lat - car.lat) < r.r + 2.4) { score += 25; popups.push({ txt: 'CLOSE CALL +25', life: 0 }); }
      }
    }
  }

  for (const p of particles) {
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.d += p.vd * dt; p.vy -= 9.8 * dt;
    if (p.y < 0) { p.y = 0; p.vy *= -0.35; p.vx *= 0.7; p.vd *= 0.7; }
  }
  particles = particles.filter(p => p.life < p.max);
  for (const p of popups) p.life += dt;
  popups = popups.filter(p => p.life < 1.2);
  shake = Math.max(0, shake - dt * 1.6);

  F = F0 * (1.06 - speed * 0.0018);
  camS = roadDX(pos);
  camX = roadX(pos) + car.lat * 0.8;
  camY = roadY(pos) + CAM_H;
}

// ---- sky ------------------------------------------------------------------------
const STARS = Array.from({ length: 260 }, () => ({ u: Math.random() * 6.28, v: Math.random(), s: Math.random() * 1.6 + 0.4, p: Math.random() * 6.28 }));
function drawSky() {
  const sky = g.createLinearGradient(0, 0, 0, CY);
  sky.addColorStop(0, '#03010a');
  sky.addColorStop(0.55, '#0e0526');
  sky.addColorStop(0.85, '#22093a');
  sky.addColorStop(1, col(FOG[0], FOG[1], FOG[2], 0));
  g.fillStyle = sky; g.fillRect(0, 0, W, CY + 2);
  g.fillStyle = col(FOG[0], FOG[1], FOG[2], 0); g.fillRect(0, CY, W, H - CY);

  const ang = Math.atan(camS);
  for (const s of STARS) {
    let x = ((s.u - ang) % 6.28 + 6.28) % 6.28;           // azimuth around the full circle
    x = CX + (x - 3.14) * F * 0.9;
    if (x < -5 || x > W + 5) continue;
    const y = s.v * s.v * CY * 0.92;
    const a = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.3 + s.p));
    g.fillStyle = rgba(220, 210, 255, a * (1 - s.v * 0.6));
    g.fillRect(x, y, s.s * DPR, s.s * DPR);
  }
  // moon
  const mx = CX + (-0.42 - ang) * F, my = CY * 0.32, mr = H * 0.045;
  const glow = g.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 5);
  glow.addColorStop(0, 'rgba(200,180,255,0.35)'); glow.addColorStop(1, 'rgba(120,60,200,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(mx, my, mr * 5, 0, 6.29); g.fill();
  g.fillStyle = '#efe6ff'; g.beginPath(); g.arc(mx, my, mr, 0, 6.29); g.fill();
  g.fillStyle = 'rgba(14,5,38,0.92)'; g.beginPath(); g.arc(mx + mr * 0.45, my - mr * 0.15, mr * 0.9, 0, 6.29); g.fill();
  // distant mesas
  g.fillStyle = '#170a2c';
  g.beginPath(); g.moveTo(0, CY + 2);
  for (let x = 0; x <= W + 8; x += 8) {
    const u = (x - CX) / F + ang;
    const h = (0.012 + 0.07 * Math.pow(vnoise(u * 5 + 30), 2.2) + 0.012 * vnoise(u * 31)) * H;
    g.lineTo(x, CY - h);
  }
  g.lineTo(W, CY + 2); g.closePath(); g.fill();
  const hz = g.createLinearGradient(0, CY - H * 0.04, 0, CY + 4);
  hz.addColorStop(0, 'rgba(255,40,170,0)'); hz.addColorStop(1, 'rgba(255,40,170,0.18)');
  g.fillStyle = hz; g.fillRect(0, CY - H * 0.04, W, H * 0.04 + 4);
}

// ---- world --------------------------------------------------------------------------
function wallP(k, seed) {
  const b = HALF + 7 + 9 * vnoise(k * 0.09 + seed) + 1.2 * hash(k + seed * 7);
  const h = 10 + 24 * vnoise(k * 0.05 + seed * 3 + 11) + 2.5 * hash(k * 1.3 + seed);
  const o = 3 + 9 * vnoise(k * 0.12 + seed * 5 + 40);
  return [b, h, o];
}
function quad(x1, y1, x2, y2, x3, y3, x4, y4, fill, seam) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.lineTo(x4, y4); g.closePath();
  g.fillStyle = fill; g.fill();
  if (seam) { g.strokeStyle = fill; g.lineWidth = 1; g.stroke(); }
}
const STRATA = [[66, 26, 58], [86, 36, 66], [58, 22, 54]];
const BANDS = [0, 0.3, 0.62, 1];

function drawRock(r) {
  const z0 = r.d - pos;
  if (z0 < 1.2) return;
  const rx = roadX(r.d) + r.lat, ry = roadY(r.d);
  const vs = r.mesh.map(v => view(rx + v[0], ry + v[1], r.d + v[2]));
  let cx = 0, cy = 0, cz = 0;
  for (const v of vs) { cx += v[0]; cy += v[1]; cz += v[2]; }
  const fog = Math.min(1, Math.pow(z0 / (NSEG * SEG), 1.3));
  drawFaces(vs, ICO_F, [cx / 12, cy / 12, cz / 12], r.hit ? [130, 66, 70] : [96, 50, 60], [60, 240, 255], fog, 'rock');
}

function carPt(lx, ly, lz) {
  const ca = Math.cos(car.yaw), sa = Math.sin(car.yaw);
  const x = lx * ca + lz * sa, z = -lx * sa + lz * ca;
  return view(roadX(car.d) + car.lat + x + roadDX(car.d) * z, roadY(car.d) + ly + car.bob, car.d + z);
}
function scr(v) { const s = F / v[2]; return [CX + v[0] * s, CY - v[1] * s]; }

function drawCar() {
  g.save();
  g.globalCompositeOperation = 'lighter';
  // headlight beams on the road
  if (state !== 'crash' || Math.sin(crashT * 30) > 0) {
    const a = scr(carPt(-0.7, 0.05, CAR_LEN)), b = scr(carPt(0.7, 0.05, CAR_LEN));
    const c = scr(carPt(6.5, 0.05, 50)), d = scr(carPt(-6.5, 0.05, 50));
    const gr = g.createLinearGradient(0, a[1], 0, c[1]);
    gr.addColorStop(0, 'rgba(255,235,200,0.32)'); gr.addColorStop(1, 'rgba(255,200,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(c[0], c[1]); g.lineTo(d[0], d[1]); g.closePath(); g.fill();
  }
  // underglow
  const cv0 = carPt(0, 0.02, CAR_LEN / 2);
  if (cv0[2] > NEAR) {
    const [ux, uy] = scr(cv0), R = 2.4 * F / cv0[2];
    g.translate(ux, uy); g.scale(1, 0.28);
    const ug = g.createRadialGradient(0, 0, 0, 0, 0, R);
    ug.addColorStop(0, 'rgba(0,255,240,0.6)'); ug.addColorStop(1, 'rgba(0,255,240,0)');
    g.fillStyle = ug; g.beginPath(); g.arc(0, 0, R, 0, 6.29); g.fill();
  }
  g.restore();

  // body parts (fixed back-to-front order: we always see the car from behind and above)
  for (const p of CAR) {
    const vs = p.v.map(v => carPt(v[0], v[1], v[2]));
    let cx = 0, cy = 0, cz = 0;
    for (const v of vs) { cx += v[0]; cy += v[1]; cz += v[2]; }
    drawFaces(vs, BOX_F, [cx / 8, cy / 8, cz / 8], p.c, p.e, 0, 'car');
  }

  // tail lights
  g.save();
  g.shadowColor = '#ff2a6d'; g.shadowBlur = 22 * DPR;
  const flick = state === 'crash' ? (Math.sin(crashT * 25) > 0 ? 1 : 0.25) : 1;
  g.fillStyle = rgba(255, 42, 109, flick);
  for (const sx of [-1, 1]) {
    const pts = [[0.32, 0.5], [0.92, 0.5], [0.92, 0.63], [0.32, 0.63]].map(q => scr(carPt(sx * q[0], q[1], 0.06)));
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < 4; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill();
  }
  g.fillStyle = rgba(255, 90, 150, 0.7 * flick);
  const bar = [[-0.32, 0.55], [0.32, 0.55], [0.32, 0.58], [-0.32, 0.58]].map(q => scr(carPt(q[0], q[1], 0.06)));
  g.beginPath(); g.moveTo(bar[0][0], bar[0][1]); for (let i = 1; i < 4; i++) g.lineTo(bar[i][0], bar[i][1]); g.closePath(); g.fill();
  g.restore();
}

function drawWorld() {
  const base = Math.floor(pos / SEG);
  const S = [];
  for (let i = 0; i <= NSEG; i++) {
    const k = base + i;
    let d = k * SEG, z = d - pos;
    if (z < NEAR) { z = NEAR; d = pos + NEAR; }
    const vx = roadX(d) - camX - camS * z, vy = roadY(d) - camY;
    S.push({ k, z, vx, vy, sc: F / z, fog: Math.min(1, Math.pow(z / (NSEG * SEG), 1.3)), wl: wallP(k, 1), wr: wallP(k, 7) });
  }
  const buckets = [];
  for (const r of rocks) {
    const idx = Math.floor(r.d / SEG) - base;
    if (idx >= 0 && idx < NSEG) (buckets[idx] || (buckets[idx] = [])).push(r);
  }
  const X = (s, L) => CX + (s.vx + L) * s.sc;
  const Y = (s, h) => CY - (s.vy + h) * s.sc;
  let carDrawn = false;

  for (let i = NSEG - 1; i >= 0; i--) {
    const A = S[i], B = S[i + 1];
    const f = A.fog, k = A.k;
    const ay = Y(A, 0), by = Y(B, 0);

    // sand floor between the canyon walls
    const sand = (Math.floor(k / 3) & 1) ? [44, 20, 46] : [39, 17, 41];
    quad(X(A, -A.wl[0]), ay, X(B, -B.wl[0]), by, X(B, B.wr[0]), by, X(A, A.wr[0]), ay, col(sand[0], sand[1], sand[2], f), true);
    // asphalt
    const rd = (Math.floor(k / 2) & 1) ? [20, 14, 28] : [24, 17, 33];
    quad(X(A, -HALF), ay, X(B, -HALF), by, X(B, HALF), by, X(A, HALF), ay, col(rd[0], rd[1], rd[2], f), true);
    // neon edge strips
    const ef = f * 0.65;
    quad(X(A, -HALF - 0.4), ay, X(B, -HALF - 0.4), by, X(B, -HALF), by, X(A, -HALF), ay, col(255, 40, 200, ef));
    quad(X(A, HALF), ay, X(B, HALF), by, X(B, HALF + 0.4), by, X(A, HALF + 0.4), ay, col(255, 40, 200, ef));
    // lane dashes
    if (k % 5 < 2) {
      for (const L of [-HALF / 3, HALF / 3])
        quad(X(A, L - 0.09), ay, X(B, L - 0.09), by, X(B, L + 0.09), by, X(A, L + 0.09), ay, col(40, 240, 255, f * 0.8));
    }
    // canyon walls, three strata bands each side
    for (const side of [-1, 1]) {
      const pa = side < 0 ? A.wl : A.wr, pb = side < 0 ? B.wl : B.wr;
      const shade = (side < 0 ? 0.72 : 1.0) * (0.9 + 0.2 * hash(k * 3.1 + side));
      for (let j = 0; j < 3; j++) {
        const t0 = BANDS[j], t1 = BANDS[j + 1], c = STRATA[j];
        const xa0 = side * (pa[0] + pa[2] * t0), xa1 = side * (pa[0] + pa[2] * t1);
        const xb0 = side * (pb[0] + pb[2] * t0), xb1 = side * (pb[0] + pb[2] * t1);
        quad(X(A, xa0), Y(A, pa[1] * t0), X(B, xb0), Y(B, pb[1] * t0), X(B, xb1), Y(B, pb[1] * t1), X(A, xa1), Y(A, pa[1] * t1),
             col(c[0] * shade, c[1] * shade, c[2] * shade, f), true);
      }
      // moonlit rim
      g.strokeStyle = rgba(255, 130, 200, 0.55 * (1 - f));
      g.lineWidth = 1.5 * DPR;
      g.beginPath();
      g.moveTo(X(A, side * (pa[0] + pa[2])), Y(A, pa[1]));
      g.lineTo(X(B, side * (pb[0] + pb[2])), Y(B, pb[1]));
      g.stroke();
    }
    // roadside reflector posts
    if (k % 6 === 0 && A.z > 1.5) {
      for (const side of [-1, 1]) {
        const x = X(A, side * (HALF + 1.3)), y0 = ay, y1 = Y(A, 1.3);
        g.strokeStyle = col(70, 50, 90, f); g.lineWidth = Math.max(1, 0.12 * A.sc);
        g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
        const tip = side < 0 ? [255, 160, 40] : [40, 240, 255];
        const rr = Math.max(1.2 * DPR, 0.16 * A.sc);
        g.fillStyle = rgba(tip[0], tip[1], tip[2], 0.25 * (1 - f));
        g.beginPath(); g.arc(x, y1, rr * 3, 0, 6.29); g.fill();
        g.fillStyle = col(tip[0], tip[1], tip[2], f * 0.6);
        g.beginPath(); g.arc(x, y1, rr, 0, 6.29); g.fill();
      }
    }
    // rocks in this segment, far to near
    const bk = buckets[i];
    if (bk) { bk.sort((p, q) => q.d - p.d); for (const r of bk) drawRock(r); }
  }
  if (!carDrawn) drawCar();
}

function drawParticles() {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const v = view(roadX(p.d) + p.x, roadY(p.d) + p.y, p.d);
    if (v[2] < NEAR) continue;
    const [x, y] = scr(v), s = Math.max(1.5 * DPR, p.size * F / v[2]);
    g.fillStyle = rgba(p.c[0], p.c[1], p.c[2], 1 - p.life / p.max);
    g.fillRect(x - s / 2, y - s / 2, s, s);
  }
  g.restore();
}

// ---- HUD ------------------------------------------------------------------------------
function neon(txt, x, y, size, c, align) {
  g.font = 'bold ' + Math.round(size) + 'px "Courier New", Courier, monospace';
  g.textAlign = align || 'left';
  g.shadowColor = c; g.shadowBlur = size * 0.45; g.fillStyle = c;
  g.fillText(txt, x, y);
  g.shadowBlur = 0; g.globalAlpha = 0.6; g.fillStyle = '#fff'; g.fillText(txt, x, y); g.globalAlpha = 1;
}
function clock() {
  const m = 7 + Math.floor(playT / 2), hh = 2 + Math.floor(m / 60), mm = m % 60;
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + ' AM';
}
function drawHUD() {
  g.save(); g.textBaseline = 'top';
  const s = H * 0.042, pad = H * 0.03;
  neon('SCORE ' + String(Math.floor(score)).padStart(6, '0'), pad, pad, s, '#ff2bd6', 'left');
  neon('BEST  ' + String(Math.max(best, state === 'play' ? 0 : 0)).padStart(6, '0'), pad, pad + s * 1.2, s * 0.6, '#b07cff', 'left');
  neon(Math.round(speed * 3.6) + ' KM/H', W - pad, pad, s, '#2ef2ff', 'right');
  neon(clock(), W - pad, pad + s * 1.2, s * 0.6, '#ffb347', 'right');
  for (const p of popups) {
    g.globalAlpha = 1 - p.life / 1.2;
    neon(p.txt, CX, H * 0.2 - p.life * H * 0.05, s * 0.75, '#ffe14d', 'center');
  }
  g.globalAlpha = 1;
  g.restore();
}
function drawOverlay() {
  if (state === 'play') return;
  g.save(); g.textBaseline = 'middle';
  if (state === 'crash' && crashT < 0.7) { g.restore(); return; }
  g.fillStyle = 'rgba(6,2,16,0.55)'; g.fillRect(0, 0, W, H);
  const s = H * 0.09;
  const pulse = 0.6 + 0.4 * Math.sin(t * 4);
  if (state === 'ready') {
    neon('NEON CANYON', CX, H * 0.36, s, '#ff2bd6', 'center');
    neon('02:07 AM  ·  somewhere in the desert', CX, H * 0.36 + s * 0.85, s * 0.28, '#b07cff', 'center');
    neon('← →  or  A D  to steer  ·  dodge the rocks', CX, H * 0.56, s * 0.3, '#2ef2ff', 'center');
    g.globalAlpha = pulse;
    neon('PRESS SPACE TO DRIVE', CX, H * 0.66, s * 0.38, '#ffe14d', 'center');
  } else {
    neon('WRECKED', CX, H * 0.36, s, '#ff2a6d', 'center');
    neon('SCORE ' + Math.floor(score) + '   BEST ' + best, CX, H * 0.36 + s * 0.85, s * 0.34, '#2ef2ff', 'center');
    g.globalAlpha = pulse;
    neon('PRESS SPACE TO RESTART', CX, H * 0.62, s * 0.38, '#ffe14d', 'center');
  }
  g.restore();
}
function drawScanlines() {
  g.fillStyle = 'rgba(0,0,0,0.12)';
  const step = 3 * DPR;
  for (let y = 0; y < H; y += step) g.fillRect(0, y, W, DPR);
  const v = g.createRadialGradient(CX, H / 2, H * 0.3, CX, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---- main loop ------------------------------------------------------------------------------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (shake > 0) g.translate((Math.random() - 0.5) * shake * 30 * DPR, (Math.random() - 0.5) * shake * 30 * DPR);
  drawSky();
  drawWorld();
  drawParticles();
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawScanlines();
  drawHUD();
  drawOverlay();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
