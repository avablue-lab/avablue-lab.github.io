<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Skate</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04070f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #eaf4ff; }
  canvas { display: block; }
  #hud { position: fixed; top: 16px; left: 20px; pointer-events: none;
    text-shadow: 0 0 10px rgba(120, 190, 255, .7), 0 2px 4px rgba(0, 0, 0, .6); }
  #score { font-size: 32px; font-weight: 800; letter-spacing: .5px; }
  #score .s { color: #ffd76a; text-shadow: 0 0 12px rgba(255, 200, 80, .9); }
  #best { font-size: 14px; opacity: .75; margin-top: 2px; }
  #demo { position: fixed; top: 18px; right: 20px; font-size: 13px; letter-spacing: 1px;
    padding: 5px 10px; border-radius: 6px; background: rgba(10, 25, 50, .55);
    border: 1px solid rgba(140, 200, 255, .35); pointer-events: none; }
  #demo:empty { display: none; }
  #msg { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; text-shadow: 0 0 14px rgba(90, 170, 255, .8), 0 2px 6px rgba(0, 0, 0, .7); }
  #msg .big { font-size: 40px; font-weight: 800; letter-spacing: 1px; }
  #msg .mid { font-size: 20px; margin-top: 8px; }
  #msg .small { font-size: 15px; margin-top: 12px; opacity: .85; }
</style>
</head>
<body>
<div id="hud"><div id="score"><span class="s">&#9733;</span> 0</div><div id="best"></div></div>
<div id="demo"></div>
<div id="msg"></div>
<script src="../../_lib/three-r128.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  const DT = 1 / 60;
  const R = 40;                 // lake radius
  const EDGE = R - 1.8;         // where the skater bounces off the snowbank
  const TURN = 2.5;             // rad/s at full steer
  const BASE_SPEED = 7;
  const MAX_SPEED = 12.5;
  const COLLECT_R = 1.15;
  const HIT_R = 0.32;
  const NUM_STARS = 7;
  const START_CRACKS = 9;
  const MAX_CRACKS = 44;
  const TRAIL_N = 320;
  const DEMO_SEED = 20261125;

  // ---------- seeded random ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function newSeed() { return (Math.random() * 4294967296) >>> 0; }
  function angleDiff(a, b) {
    let d = (a - b + Math.PI) % (Math.PI * 2);
    if (d < 0) d += Math.PI * 2;
    return d - Math.PI;
  }
  function wrap(v, m) { return ((v % m) + m) % m; }

  // ---------- demo mode ----------
  function parseT() {
    const m = /[#&]t=([0-9]*\.?[0-9]+)/.exec(location.hash);
    return m ? Math.max(0, parseFloat(m[1])) : null;
  }
  let demoT = parseT();
  const DEMO = demoT !== null;

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070d1c);
  scene.fog = new THREE.FogExp2(0x0a1328, 0.017);

  const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.3, 1200);

  // ---------- textures ----------
  function glowTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.18, 'rgba(255,255,255,0.65)');
    gr.addColorStop(0.45, 'rgba(255,255,255,0.18)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = glowTexture();

  function iceTexture() {
    const rng = mulberry32(77);
    const S = 1024;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = '#9fbcd8';
    g.fillRect(0, 0, S, S);
    function tiled(fn) {
      for (let ox = -S; ox <= S; ox += S) {
        for (let oy = -S; oy <= S; oy += S) {
          g.save(); g.translate(ox, oy); fn(); g.restore();
        }
      }
    }
    // cloudy patches
    for (let i = 0; i < 200; i++) {
      const x = rng() * S, y = rng() * S, r = 20 + rng() * 130;
      const light = rng() < 0.5, a = 0.05 + rng() * 0.08;
      tiled(function () {
        const gr = g.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, light ? 'rgba(225,238,255,' + a + ')' : 'rgba(55,85,125,' + a + ')');
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      });
    }
    // skate scratches
    g.lineCap = 'round';
    for (let i = 0; i < 520; i++) {
      const x = rng() * S, y = rng() * S, ang = rng() * Math.PI * 2, len = 30 + rng() * 220;
      const bend = (rng() - 0.5) * len * 0.5;
      const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
      const cx = (x + ex) / 2 - Math.sin(ang) * bend, cy = (y + ey) / 2 + Math.cos(ang) * bend;
      const a = 0.04 + rng() * 0.14, w = 0.5 + rng() * 1.4;
      tiled(function () {
        g.strokeStyle = 'rgba(255,255,255,' + a + ')';
        g.lineWidth = w;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(cx, cy, ex, ey); g.stroke();
      });
    }
    // frozen bubbles
    for (let i = 0; i < 260; i++) {
      const x = rng() * S, y = rng() * S, r = 0.6 + rng() * 2.2, a = 0.1 + rng() * 0.25;
      tiled(function () {
        g.fillStyle = 'rgba(255,255,255,' + a + ')';
        g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
      });
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(9, 9);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // ---------- sky ----------
  const skyGroup = new THREE.Group();
  scene.add(skyGroup);
  (function buildSky() {
    const geo = new THREE.SphereGeometry(450, 32, 16);
    const pos = geo.attributes.position;
    const cols = new Float32Array(pos.count * 3);
    const horizon = new THREE.Color(0x1d2d52), zenith = new THREE.Color(0x02040c), tmp = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const h = Math.max(0, pos.getY(i) / 450);
      tmp.copy(horizon).lerp(zenith, Math.pow(h, 0.55));
      cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const sky = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false }));
    sky.renderOrder = -10;
    skyGroup.add(sky);

    const rng = mulberry32(4242);
    const N = 1600, sp = new Float32Array(N * 3), sc = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const u = rng() * Math.PI * 2, v = 0.04 + rng() * 0.96;
      const y = Math.pow(v, 0.8), rr = Math.sqrt(1 - y * y);
      sp[i * 3] = Math.cos(u) * rr * 400; sp[i * 3 + 1] = y * 400; sp[i * 3 + 2] = Math.sin(u) * rr * 400;
      const b = 0.35 + rng() * 0.65, tint = rng();
      sc[i * 3] = b * (tint < 0.2 ? 1 : 0.85); sc[i * 3 + 1] = b * 0.92; sc[i * 3 + 2] = b;
    }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    sg.setAttribute('color', new THREE.BufferAttribute(sc, 3));
    const stars = new THREE.Points(sg, new THREE.PointsMaterial({
      size: 1.7, sizeAttenuation: false, vertexColors: true, fog: false, transparent: true, depthWrite: false }));
    stars.renderOrder = -9;
    skyGroup.add(stars);
  })();

  const moonDir = new THREE.Vector3(0.38, 0.4, 1).normalize();
  (function buildMoon() {
    const moon = new THREE.Mesh(new THREE.SphereGeometry(13, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xf4f1df, fog: false }));
    moon.position.copy(moonDir).multiplyScalar(360);
    moon.renderOrder = -8;
    skyGroup.add(moon);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x8fb0ff, fog: false,
      transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
    halo.position.copy(moon.position);
    halo.scale.setScalar(130);
    halo.renderOrder = -7;
    skyGroup.add(halo);
  })();

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0x5a74a8, 0x0b1222, 0.7));
  const moonLight = new THREE.DirectionalLight(0xa8c0ff, 0.6);
  moonLight.position.copy(moonDir).multiplyScalar(100);
  scene.add(moonLight);
  const playerLight = new THREE.PointLight(0xcfe4ff, 0.9, 16, 2);
  scene.add(playerLight);

  // ---------- world ----------
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400),
    new THREE.MeshLambertMaterial({ color: 0x7d8fae }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  scene.add(ground);

  const lake = new THREE.Mesh(new THREE.CircleGeometry(R + 0.6, 96),
    new THREE.MeshPhongMaterial({ map: iceTexture(), color: 0xc4dbf2, specular: 0x6f8fb8,
      shininess: 70, emissive: 0x0b1826 }));
  lake.rotation.x = -Math.PI / 2;
  scene.add(lake);

  const bank = new THREE.Mesh(new THREE.TorusGeometry(R + 1.3, 1.3, 10, 140),
    new THREE.MeshLambertMaterial({ color: 0xc9d6ea }));
  bank.rotation.x = Math.PI / 2;
  bank.scale.set(1, 1, 0.38);
  scene.add(bank);

  (function buildTrees() {
    const rng = mulberry32(9001);
    const N = 150, TIERS = 3;
    const trunkGeo = new THREE.CylinderGeometry(0.15, 0.22, 1, 6); trunkGeo.translate(0, 0.5, 0);
    const coneGeo = new THREE.ConeGeometry(1, 1, 8); coneGeo.translate(0, 0.5, 0);
    const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshLambertMaterial({ color: 0x2b1e16 }), N);
    const leaves = new THREE.InstancedMesh(coneGeo, new THREE.MeshLambertMaterial({ color: 0x14322b }), N * TIERS);
    const snow = new THREE.InstancedMesh(coneGeo, new THREE.MeshLambertMaterial({ color: 0xdfe8f6 }), N * TIERS);
    const d = new THREE.Object3D();
    for (let i = 0; i < N; i++) {
      const a = rng() * Math.PI * 2, rr = R + 5 + Math.pow(rng(), 0.7) * 70;
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr, h = 4 + rng() * 6.5, rot = rng() * 6;
      d.position.set(x, 0, z); d.rotation.set(0, rot, 0); d.scale.set(1, h * 0.3, 1); d.updateMatrix();
      trunks.setMatrixAt(i, d.matrix);
      for (let k = 0; k < TIERS; k++) {
        const w = h * 0.3 * (1 - k * 0.26), th = h * 0.42, y = h * 0.2 + k * h * 0.22;
        d.position.set(x, y, z); d.scale.set(w, th, w); d.updateMatrix();
        leaves.setMatrixAt(i * TIERS + k, d.matrix);
        d.position.set(x, y + th * 0.5, z); d.scale.set(w * 0.62, th * 0.5, w * 0.62); d.updateMatrix();
        snow.setMatrixAt(i * TIERS + k, d.matrix);
      }
    }
    scene.add(trunks, leaves, snow);
  })();

  (function buildLanterns() {
    const postGeo = new THREE.CylinderGeometry(0.07, 0.09, 2.2, 8);
    const postMat = new THREE.MeshLambertMaterial({ color: 0x1b1f28 });
    const lampGeo = new THREE.SphereGeometry(0.22, 12, 8);
    const lampMat = new THREE.MeshBasicMaterial({ color: 0xffc27a });
    const glowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffa850, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false });
    for (let k = 0; k < 6; k++) {
      const a = k / 6 * Math.PI * 2 + 0.3, x = Math.cos(a) * (R + 1.4), z = Math.sin(a) * (R + 1.4);
      const post = new THREE.Mesh(postGeo, postMat); post.position.set(x, 1.1, z); scene.add(post);
      const lamp = new THREE.Mesh(lampGeo, lampMat); lamp.position.set(x, 2.3, z); scene.add(lamp);
      const gl = new THREE.Sprite(glowMat); gl.position.set(x, 2.3, z); gl.scale.setScalar(3.4); scene.add(gl);
      const pl = new THREE.PointLight(0xffaa66, 1.4, 17, 2); pl.position.set(x, 2.4, z); scene.add(pl);
    }
  })();

  // ---------- the skater ----------
  const player = new THREE.Group();
  scene.add(player);
  const body = new THREE.Group();
  player.add(body);
  function mat(c) { return new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.05 }); }
  const coatM = mat(0x3a6df0), pantsM = mat(0x1c2333), skinM = mat(0xf2d3c0), hairM = mat(0xf4efe6),
    accentM = mat(0xff4f7a), bootM = mat(0xf7f9fc), bladeM = new THREE.MeshStandardMaterial({ color: 0xd8e2ee, roughness: 0.2, metalness: 0.9 });
  function part(geo, m, x, y, z, parent) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); parent.add(o); return o; }
  function makeLeg(side) {
    const hip = new THREE.Group(); hip.position.set(0.13 * side, 1.0, 0); body.add(hip);
    part(new THREE.BoxGeometry(0.16, 0.86, 0.18), pantsM, 0, -0.43, 0, hip);
    part(new THREE.BoxGeometry(0.17, 0.18, 0.3), bootM, 0, -0.88, 0.04, hip);
    part(new THREE.BoxGeometry(0.03, 0.05, 0.4), bladeM, 0, -0.99, 0.04, hip);
    return hip;
  }
  const legL = makeLeg(1), legR = makeLeg(-1);
  part(new THREE.CylinderGeometry(0.22, 0.29, 0.78, 14), coatM, 0, 1.36, 0, body);
  part(new THREE.CylinderGeometry(0.3, 0.3, 0.12, 14), coatM, 0, 0.98, 0, body);
  function makeArm(side) {
    const sh = new THREE.Group(); sh.position.set(0.31 * side, 1.66, 0); body.add(sh);
    part(new THREE.BoxGeometry(0.12, 0.58, 0.13), coatM, 0, -0.29, 0, sh);
    part(new THREE.SphereGeometry(0.08, 10, 8), accentM, 0, -0.62, 0, sh);
    return sh;
  }
  const armL = makeArm(1), armR = makeArm(-1);
  part(new THREE.SphereGeometry(0.2, 18, 14), skinM, 0, 1.98, 0, body);
  const hairTop = part(new THREE.SphereGeometry(0.215, 18, 14), hairM, 0, 2.0, -0.035, body);
  hairTop.scale.set(1, 1, 0.95);
  part(new THREE.BoxGeometry(0.38, 0.55, 0.1), hairM, 0, 1.74, -0.15, body);
  part(new THREE.SphereGeometry(0.225, 18, 8, 0, Math.PI * 2, 0, Math.PI / 2), accentM, 0, 2.04, -0.01, body);
  part(new THREE.SphereGeometry(0.075, 10, 8), mat(0xffffff), 0, 2.27, -0.01, body);
  const scarf = part(new THREE.TorusGeometry(0.16, 0.06, 8, 18), accentM, 0, 1.78, 0, body);
  scarf.rotation.x = Math.PI / 2;
  const scarfTail = part(new THREE.BoxGeometry(0.1, 0.34, 0.05), accentM, 0.09, 1.58, -0.2, body);
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x1a2030 });
  part(new THREE.SphereGeometry(0.025, 8, 6), eyeM, 0.07, 2.0, 0.18, body);
  part(new THREE.SphereGeometry(0.025, 8, 6), eyeM, -0.07, 2.0, 0.18, body);

  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.6, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.012;
  scene.add(shadow);

  // ---------- the hole you fall into ----------
  const hole = new THREE.Group();
  scene.add(hole);
  (function buildHole() {
    const rim = new THREE.Mesh(new THREE.CircleGeometry(1.35, 32), new THREE.MeshBasicMaterial({ color: 0x01040a }));
    rim.rotation.x = -Math.PI / 2; rim.position.y = 0.06; hole.add(rim);
    const water = new THREE.Mesh(new THREE.CircleGeometry(1.12, 32),
      new THREE.MeshPhongMaterial({ color: 0x0b2846, specular: 0x88aaff, shininess: 120, emissive: 0x020a16 }));
    water.rotation.x = -Math.PI / 2; water.position.y = 0.07; hole.add(water);
    const rng = mulberry32(555);
    const shardGeo = new THREE.BoxGeometry(0.5, 0.07, 0.32);
    const shardM = new THREE.MeshLambertMaterial({ color: 0xdbe9ff });
    for (let i = 0; i < 14; i++) {
      const a = i / 14 * Math.PI * 2 + rng() * 0.3, rr = 1.25 + rng() * 0.35;
      const s = new THREE.Mesh(shardGeo, shardM);
      s.position.set(Math.cos(a) * rr, 0.08, Math.sin(a) * rr);
      s.rotation.set((rng() - 0.5) * 0.7, -a, (rng() - 0.5) * 0.7);
      s.scale.setScalar(0.6 + rng() * 0.7);
      hole.add(s);
    }
  })();
  const ripple = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 48),
    new THREE.MeshBasicMaterial({ color: 0x9fd8ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  ripple.rotation.x = -Math.PI / 2;
  ripple.position.y = 0.08;
  hole.add(ripple);
  hole.visible = false;

  // ---------- shared assets for stars and cracks ----------
  function starShape() {
    const s = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 0.22 : 0.5, a = i / 10 * Math.PI * 2 + Math.PI / 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
    }
    s.closePath();
    return s;
  }
  const starGeo = new THREE.ExtrudeGeometry(starShape(),
    { depth: 0.14, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.04, bevelSegments: 2 });
  starGeo.center();
  const starMat = new THREE.MeshStandardMaterial({ color: 0xffe48a, emissive: 0xffb830,
    emissiveIntensity: 0.95, roughness: 0.35, metalness: 0.2 });
  const starGlowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xffd070, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false });
  const planeGeo = new THREE.PlaneGeometry(1, 1);
  const groundGlowMat = new THREE.MeshBasicMaterial({ map: glowTex, color: 0xffc860, transparent: true,
    opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });

  const crackCoreMat = new THREE.MeshBasicMaterial({ color: 0x020812, side: THREE.DoubleSide,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const crackEdgeMat = new THREE.MeshBasicMaterial({ color: 0x7cc8ff, transparent: true, opacity: 0.6,
    depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
  const patchMat = new THREE.MeshBasicMaterial({ map: glowTex, color: 0x0a1a30, transparent: true,
    opacity: 0.6, depthWrite: false });

  // particle pool (star sparkles and splashes)
  const POOL = 120, pool = [];
  for (let i = 0; i < POOL; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffffff, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false }));
    sp.visible = false;
    scene.add(sp);
    pool.push(sp);
  }

  // skate trail (two blade lines)
  function makeTrailLine() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xf0f8ff, transparent: true, opacity: 0.45 }));
    l.frustumCulled = false;
    scene.add(l);
    return l;
  }
  const trailL = makeTrailLine(), trailR = makeTrailLine();

  // falling snow
  const SN = 700;
  const snowBase = new Float32Array(SN * 3);
  (function () {
    const rng = mulberry32(31337);
    for (let i = 0; i < SN; i++) { snowBase[i * 3] = rng() * 60; snowBase[i * 3 + 1] = rng() * 18; snowBase[i * 3 + 2] = rng() * 60; }
  })();
  const snowGeo = new THREE.BufferGeometry();
  snowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SN * 3), 3));
  const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.16, map: glowTex,
    transparent: true, opacity: 0.85, depthWrite: false }));
  snow.frustumCulled = false;
  scene.add(snow);

  // ---------- cracks ----------
  function makeCrackShape(rng) {
    const segs = [];
    const size = 0.9 + rng() * 0.6;
    const nb = 3 + Math.floor(rng() * 3);
    const base = rng() * Math.PI * 2;
    function branch(x, z, ang, n, w, depth) {
      for (let i = 0; i < n; i++) {
        ang += (rng() - 0.5) * 0.9;
        const l = (0.45 + rng() * 0.55) * size;
        const nx = x + Math.sin(ang) * l, nz = z + Math.cos(ang) * l;
        segs.push({ ax: x, az: z, bx: nx, bz: nz, w: w });
        if (depth < 1 && rng() < 0.35) {
          branch(nx, nz, ang + (rng() < 0.5 ? -1 : 1) * (0.6 + rng() * 0.5), 2 + Math.floor(rng() * 2), w * 0.6, depth + 1);
        }
        x = nx; z = nz; w *= 0.8;
      }
    }
    for (let b = 0; b < nb; b++) {
      branch(0, 0, base + b / nb * Math.PI * 2 + (rng() - 0.5) * 0.7, 3 + Math.floor(rng() * 3), 0.17, 0);
    }
    let r = 0;
    for (const s of segs) r = Math.max(r, Math.hypot(s.bx, s.bz), Math.hypot(s.ax, s.az));
    return { segs: segs, r: r };
  }

  function segDist(px, pz, ax, az, bx, bz) {
    const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz;
    let t = L2 > 0 ? ((px - ax) * dx + (pz - az) * dz) / L2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const qx = ax + dx * t - px, qz = az + dz * t - pz;
    return Math.sqrt(qx * qx + qz * qz);
  }
  function crackDist(c, px, pz) {
    const lx = px - c.x, lz = pz - c.z, lim = c.r + 2.5;
    if (lx * lx + lz * lz > lim * lim) return 99;
    let m = 99;
    for (const s of c.segs) {
      const d = segDist(lx, lz, s.ax, s.az, s.bx, s.bz) - s.w * 0.5;
      if (d < m) m = d;
    }
    return m;
  }

  function quadGeo(segs, wMul, extra) {
    const pos = [];
    for (const sg of segs) {
      let dx = sg.bx - sg.ax, dz = sg.bz - sg.az;
      const L = Math.hypot(dx, dz) || 1;
      dx /= L; dz /= L;
      const w = sg.w * wMul + extra;
      const nx = -dz * w * 0.5, nz = dx * w * 0.5, ex = dx * w * 0.4, ez = dz * w * 0.4;
      const ax = sg.ax - ex, az = sg.az - ez, bx = sg.bx + ex, bz = sg.bz + ez;
      pos.push(ax + nx, 0, az + nz, ax - nx, 0, az - nz, bx + nx, 0, bz + nz,
        bx + nx, 0, bz + nz, ax - nx, 0, az - nz, bx - nx, 0, bz - nz);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return g;
  }

  function buildCrackObj(c) {
    const g = new THREE.Group();
    g.position.set(c.x, 0, c.z);
    const patch = new THREE.Mesh(planeGeo, patchMat);
    patch.rotation.x = -Math.PI / 2;
    patch.position.y = 0.02;
    patch.scale.setScalar(c.r * 2.5);
    g.add(patch);
    c.edgeMat = crackEdgeMat.clone();
    const edge = new THREE.Mesh(quadGeo(c.segs, 2.6, 0.07), c.edgeMat);
    edge.position.y = 0.035;
    g.add(edge);
    const core = new THREE.Mesh(quadGeo(c.segs, 1, 0), crackCoreMat);
    core.position.y = 0.05;
    g.add(core);
    g.scale.setScalar(0.001);
    scene.add(g);
    c.obj = g;
    c.geos = [edge.geometry, core.geometry];
  }

  function spawnCrack(s, initial) {
    const fx = Math.sin(s.heading), fz = Math.cos(s.heading);
    for (let tries = 0; tries < 60; tries++) {
      const a = s.rng() * Math.PI * 2, rr = Math.sqrt(s.rng()) * (R - 5);
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr;
      const shape = makeCrackShape(s.rng);
      const dx = x - s.x, dz = z - s.z, d = Math.hypot(dx, dz);
      if (d < shape.r + (initial ? 6 : 8)) continue;
      const ahead = dx * fx + dz * fz, lat = Math.abs(dx * fz - dz * fx);
      if (ahead > -2 && ahead < 18 && lat < shape.r + 3) continue;
      if (Math.hypot(x, z) + shape.r > R - 1) continue;
      let ok = true;
      for (const c of s.cracks) { if (Math.hypot(c.x - x, c.z - z) < c.r + shape.r + 1.4) { ok = false; break; } }
      if (!ok) continue;
      const c = { x: x, z: z, segs: shape.segs, r: shape.r, grow: initial ? 1 : 0 };
      for (const st of s.stars) { if (crackDist(c, st.x, st.z) < 1.6) { ok = false; break; } }
      if (!ok) continue;
      buildCrackObj(c);
      s.cracks.push(c);
      return true;
    }
    return false;
  }

  // ---------- stars ----------
  function makeStarObj(i) {
    const obj = new THREE.Group();
    const float = new THREE.Group();
    obj.add(float);
    const mesh = new THREE.Mesh(starGeo, starMat);
    float.add(mesh);
    const glow = new THREE.Sprite(starGlowMat);
    glow.scale.setScalar(2.7);
    float.add(glow);
    const gg = new THREE.Mesh(planeGeo, groundGlowMat);
    gg.rotation.x = -Math.PI / 2;
    gg.position.y = 0.03;
    obj.add(gg);
    scene.add(obj);
    return { x: 0, z: 0, obj: obj, float: float, mesh: mesh, glow: glow, ground: gg, born: -10, i: i };
  }

  function spawnStar(s, st, minFromPlayer) {
    let x = 0, z = 0;
    for (let tries = 0; tries < 80; tries++) {
      const a = s.rng() * Math.PI * 2, rr = Math.sqrt(s.rng()) * (R - 4);
      x = Math.cos(a) * rr; z = Math.sin(a) * rr;
      if (Math.hypot(x - s.x, z - s.z) < minFromPlayer) continue;
      let ok = true;
      for (const o of s.stars) { if (o !== st && Math.hypot(o.x - x, o.z - z) < 4) { ok = false; break; } }
      if (!ok) continue;
      for (const c of s.cracks) { if (crackDist(c, x, z) < 1.8) { ok = false; break; } }
      if (ok) break;
    }
    st.x = x; st.z = z; st.born = s.time;
  }

  function addBurst(s, x, y, z, color, n, spd) {
    const parts = [];
    for (let i = 0; i < n; i++) {
      const a = s.rng() * Math.PI * 2, up = 0.3 + s.rng() * 0.9, sp = spd * (0.5 + s.rng() * 0.7);
      parts.push({ vx: Math.cos(a) * sp, vy: up * sp, vz: Math.sin(a) * sp, sz: 0.25 + s.rng() * 0.3 });
    }
    s.bursts.push({ x: x, y: y, z: z, t0: s.time, color: color, parts: parts });
  }

  // ---------- game state ----------
  let state = null;
  let best = 0;
  try { best = +localStorage.getItem('nightskate.best') || 0; } catch (e) { best = 0; }

  function clearWorld() {
    if (!state) return;
    for (const st of state.stars) scene.remove(st.obj);
    for (const c of state.cracks) {
      scene.remove(c.obj);
      c.geos.forEach(function (g) { g.dispose(); });
      c.edgeMat.dispose();
    }
  }

  function resetGame(seed) {
    clearWorld();
    const s = {
      seed: seed, rng: mulberry32(seed), time: 0, steps: 0, mode: 'skate',
      x: 0, z: 0, heading: 0, steer: 0, speed: BASE_SPEED, dist: 0, score: 0,
      stars: [], cracks: [], bursts: [], trail: [],
      fallT: 0, holeX: 0, holeZ: 0, nextCrackT: 8,
      apSteer: 0, apTarget: null,
      cam: [0, 3.8, -7.5], look: [0, 0.9, 4]
    };
    state = s;
    for (let i = 0; i < START_CRACKS; i++) spawnCrack(s, true);
    for (let i = 0; i < NUM_STARS; i++) {
      const st = makeStarObj(i);
      s.stars.push(st);
      spawnStar(s, st, i < 2 ? 5 : 8);
      st.born = -10;
    }
  }

  function fall(s) {
    s.mode = 'falling';
    s.fallT = 0;
    s.holeX = s.x; s.holeZ = s.z;
    s.steer = 0;
    addBurst(s, s.x, 0.2, s.z, 0xbfe6ff, 22, 3.2);
    if (!DEMO && s.score > best) {
      best = s.score;
      try { localStorage.setItem('nightskate.best', String(best)); } catch (e) { /* ignore */ }
    }
  }

  // one fixed simulation step; input = steer in [-1, 1], +1 = left
  function step(input) {
    const s = state;
    s.time += DT;
    s.steps++;
    if (s.mode === 'skate') {
      s.steer += (input - s.steer) * Math.min(1, DT * 7);
      s.heading += s.steer * TURN * DT;
      s.speed = Math.min(MAX_SPEED, BASE_SPEED + s.score * 0.2);
      s.x += Math.sin(s.heading) * s.speed * DT;
      s.z += Math.cos(s.heading) * s.speed * DT;
      s.dist += s.speed * DT;

      const r = Math.hypot(s.x, s.z);
      if (r > EDGE) {
        const nx = s.x / r, nz = s.z / r;
        s.x = nx * EDGE; s.z = nz * EDGE;
        let dx = Math.sin(s.heading), dz = Math.cos(s.heading);
        const dot = dx * nx + dz * nz;
        if (dot > 0) { dx -= 2 * dot * nx; dz -= 2 * dot * nz; s.heading = Math.atan2(dx, dz); }
        addBurst(s, s.x + nx * 0.6, 0.3, s.z + nz * 0.6, 0xeaf4ff, 6, 2);
      }

      for (const st of s.stars) {
        if (Math.hypot(st.x - s.x, st.z - s.z) < COLLECT_R) {
          s.score++;
          addBurst(s, st.x, 0.95, st.z, 0xffd870, 16, 3.5);
          spawnStar(s, st, 8);
          if (s.score % 3 === 0 && s.cracks.length < MAX_CRACKS) spawnCrack(s, false);
        }
      }

      for (const c of s.cracks) if (c.grow < 1) c.grow = Math.min(1, c.grow + DT / 0.9);
      for (const c of s.cracks) {
        if (c.grow >= 1 && crackDist(c, s.x, s.z) < HIT_R) { fall(s); break; }
      }

      if (s.time >= s.nextCrackT) {
        s.nextCrackT += 8;
        if (s.cracks.length < MAX_CRACKS) spawnCrack(s, false);
      }

      if (s.steps % 2 === 0) {
        s.trail.push({ x: s.x, z: s.z, h: s.heading });
        if (s.trail.length > TRAIL_N) s.trail.shift();
      }
    } else {
      s.fallT += DT;
    }

    // keep only live bursts
    if (s.bursts.length && s.time - s.bursts[0].t0 > 1.2) s.bursts.shift();

    // chase camera (smoothed inside the simulation so demo frames are exact)
    const fx = Math.sin(s.heading), fz = Math.cos(s.heading);
    let tx, ty, tz, lx, ly, lz;
    if (s.mode === 'skate') {
      tx = s.x - fx * 7.5; ty = 3.8; tz = s.z - fz * 7.5;
      lx = s.x + fx * 4; ly = 0.9; lz = s.z + fz * 4;
    } else {
      const k = Math.min(1, s.fallT / 2);
      tx = s.holeX - fx * (7.5 - 2.5 * k); ty = 3.8 + 2.4 * k; tz = s.holeZ - fz * (7.5 - 2.5 * k);
      lx = s.holeX; ly = 0; lz = s.holeZ;
    }
    const a = Math.min(1, DT * 4.5), b = Math.min(1, DT * 6);
    s.cam[0] += (tx - s.cam[0]) * a; s.cam[1] += (ty - s.cam[1]) * a; s.cam[2] += (tz - s.cam[2]) * a;
    s.look[0] += (lx - s.look[0]) * b; s.look[1] += (ly - s.look[1]) * b; s.look[2] += (lz - s.look[2]) * b;
  }

  // ---------- autopilot (demo) ----------
  const CANDS = [-1, -0.6, -0.25, 0, 0.25, 0.6, 1];
  function pickTarget(s) {
    let bestSt = null, bc = Infinity, cur = Infinity;
    for (const st of s.stars) {
      const dx = st.x - s.x, dz = st.z - s.z;
      const c = Math.hypot(dx, dz) + Math.abs(angleDiff(Math.atan2(dx, dz), s.heading)) * 5;
      if (st === s.apTarget) cur = c;
      if (c < bc) { bc = c; bestSt = st; }
    }
    if (s.apTarget && cur < bc + 3) return s.apTarget;
    return bestSt;
  }
  function planSteer(s) {
    const tgt = pickTarget(s);
    s.apTarget = tgt;
    const H = 0.05, N = 34;
    let bestC = 0, bc = Infinity;
    for (const c of CANDS) {
      let h = s.heading, st = s.steer, x = s.x, z = s.z, danger = 0, got = -1;
      for (let k = 1; k <= N; k++) {
        st += (c - st) * Math.min(1, H * 7);
        h += st * TURN * H;
        x += Math.sin(h) * s.speed * H;
        z += Math.cos(h) * s.speed * H;
        if (Math.hypot(x, z) > EDGE - 0.3) danger += 3;
        const w = 1 / (1 + k * 0.06);
        for (const cr of s.cracks) {
          const d = crackDist(cr, x, z);
          if (d < 0.6) danger += 300 * w;
          else if (d < 1.5) danger += (1.5 - d) * 10 * w;
        }
        if (got < 0 && tgt && Math.hypot(tgt.x - x, tgt.z - z) < COLLECT_R * 0.9) got = k;
      }
      let cost = danger;
      if (tgt) cost += got >= 0 ? -40 + got * 0.5 : Math.hypot(tgt.x - x, tgt.z - z) * 1.2;
      cost += Math.abs(c - s.apSteer) * 0.6;
      if (cost < bc) { bc = cost; bestC = c; }
    }
    return bestC;
  }
  function autopilot(s) {
    if (s.mode !== 'skate') return 0;
    if (s.steps % 5 === 0 || s.apTarget === null) s.apSteer = planSteer(s);
    return s.apSteer;
  }

  // ---------- render one frame from state (no clock) ----------
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const demoEl = document.getElementById('demo');
  const msgEl = document.getElementById('msg');
  let lastScore = -1, lastMsg = null, lastBest = null, lastDemo = null;
  const tmpColor = new THREE.Color();

  function render() {
    const s = state, t = s.time;
    const falling = s.mode === 'falling';
    const px = falling ? s.holeX : s.x, pz = falling ? s.holeZ : s.z;

    // skater
    let py = 0;
    if (falling) py = -Math.min(2.6, s.fallT * s.fallT * 1.6);
    player.position.set(px, py, pz);
    player.rotation.y = s.heading;
    if (!falling) {
      const ph = s.dist * 1.1, sw = Math.sin(ph);
      body.rotation.set(0.18, 0, -s.steer * 0.32);
      body.position.y = Math.abs(Math.cos(ph)) * 0.04;
      legL.rotation.set(sw * 0.25, 0, 0.05 + Math.max(0, sw) * 0.35);
      legR.rotation.set(-sw * 0.25, 0, -(0.05 + Math.max(0, -sw) * 0.35));
      armL.rotation.set(-sw * 0.6, 0, 0.3 + s.steer * 0.2);
      armR.rotation.set(sw * 0.6, 0, -0.3 + s.steer * 0.2);
      scarfTail.rotation.x = 0.5 + Math.sin(t * 9) * 0.12;
      shadow.visible = true;
      shadow.position.set(px, 0.012, pz);
    } else {
      const f = s.fallT;
      body.rotation.set(-0.25, 0, Math.sin(f * 7) * 0.15);
      body.position.y = 0;
      legL.rotation.set(0.3, 0, 0.1);
      legR.rotation.set(-0.2, 0, -0.1);
      armL.rotation.set(-2.6 + Math.sin(f * 12) * 0.35, 0, 0.4);
      armR.rotation.set(-2.6 - Math.sin(f * 12) * 0.35, 0, -0.4);
      shadow.visible = false;
    }
    playerLight.position.set(px, 3.2, pz);

    // stars
    for (const st of s.stars) {
      const i = st.i;
      st.obj.position.set(st.x, 0, st.z);
      const pop = Math.min(1, Math.max(0, (t - st.born) * 3));
      st.float.position.y = 0.95 + Math.sin(t * 2.2 + i * 1.7) * 0.15;
      st.float.scale.setScalar(pop);
      st.mesh.rotation.y = t * 1.8 + i;
      const tw = 1 + Math.sin(t * 5 + i * 2.3) * 0.12;
      st.glow.scale.setScalar(2.7 * tw);
      st.ground.scale.setScalar(3.4 * tw * pop + 0.001);
    }

    // cracks
    for (const c of s.cracks) {
      const e = 1 - Math.pow(1 - c.grow, 3);
      c.obj.scale.setScalar(Math.max(0.001, e));
      c.edgeMat.opacity = c.grow < 1 ? 0.95 : 0.55 + 0.1 * Math.sin(t * 1.5 + c.x);
    }

    // particles
    let pi = 0;
    for (const b of s.bursts) {
      const age = t - b.t0;
      if (age < 0 || age > 0.9) continue;
      const life = 1 - age / 0.9;
      for (const p of b.parts) {
        if (pi >= POOL) break;
        const sp = pool[pi++];
        sp.visible = true;
        sp.position.set(b.x + p.vx * age, Math.max(0.05, b.y + p.vy * age - 4 * age * age), b.z + p.vz * age);
        sp.scale.setScalar(p.sz * (0.4 + life));
        sp.material.opacity = life;
        sp.material.color.copy(tmpColor.setHex(b.color));
      }
    }
    for (; pi < POOL; pi++) pool[pi].visible = false;

    // trail
    const tr = s.trail, la = trailL.geometry.attributes.position.array, ra = trailR.geometry.attributes.position.array;
    for (let i = 0; i < tr.length; i++) {
      const p = tr[i], ox = Math.cos(p.h) * 0.11, oz = -Math.sin(p.h) * 0.11;
      la[i * 3] = p.x + ox; la[i * 3 + 1] = 0.012; la[i * 3 + 2] = p.z + oz;
      ra[i * 3] = p.x - ox; ra[i * 3 + 1] = 0.012; ra[i * 3 + 2] = p.z - oz;
    }
    trailL.geometry.attributes.position.needsUpdate = true;
    trailR.geometry.attributes.position.needsUpdate = true;
    trailL.geometry.setDrawRange(0, tr.length);
    trailR.geometry.setDrawRange(0, tr.length);

    // hole
    hole.visible = falling;
    if (falling) {
      hole.position.set(s.holeX, 0, s.holeZ);
      const k = Math.min(1, s.fallT * 6);
      hole.scale.setScalar(0.3 + 0.7 * k);
      ripple.scale.setScalar(1 + s.fallT * 1.6);
      ripple.material.opacity = Math.max(0, 1 - s.fallT / 2);
    }

    // snow
    const sa = snowGeo.attributes.position.array;
    for (let i = 0; i < SN; i++) {
      const bx = snowBase[i * 3] + Math.sin(t * 0.7 + i) * 0.6 + t * 0.8;
      const by = snowBase[i * 3 + 1] - t * 1.3;
      const bz = snowBase[i * 3 + 2] + t * 0.3;
      sa[i * 3] = px + wrap(bx - px, 60) - 30;
      sa[i * 3 + 1] = wrap(by, 18) - 0.5;
      sa[i * 3 + 2] = pz + wrap(bz - pz, 60) - 30;
    }
    snowGeo.attributes.position.needsUpdate = true;

    // camera + sky
    camera.position.set(s.cam[0], s.cam[1], s.cam[2]);
    camera.lookAt(s.look[0], s.look[1], s.look[2]);
    skyGroup.position.copy(camera.position);

    // HUD
    if (s.score !== lastScore) {
      lastScore = s.score;
      scoreEl.innerHTML = '<span class="s">&#9733;</span> ' + s.score;
    }
    const bestTxt = DEMO ? '' : (best > 0 ? 'Best ' + best : '');
    if (bestTxt !== lastBest) { lastBest = bestTxt; bestEl.textContent = bestTxt; }
    const demoTxt = DEMO ? 'DEMO · AUTOPILOT · t=' + demoT.toFixed(2) + 's' : '';
    if (demoTxt !== lastDemo) { lastDemo = demoTxt; demoEl.textContent = demoTxt; }
    let msg = '', op = 1;
    if (falling) {
      msg = '<div class="big">You fell through the ice!</div><div class="mid">&#9733; ' + s.score +
        ' star' + (s.score === 1 ? '' : 's') + '</div><div class="small">' +
        (DEMO ? 'Autopilot restarting…' : 'Press Space to restart') + '</div>';
      op = Math.min(1, s.fallT * 2.5);
    } else if (!DEMO && s.time < 5) {
      msg = '<div class="big">NIGHT SKATE</div><div class="mid">&larr; &rarr; or A / D to steer</div>' +
        '<div class="small">Collect the glowing stars. Stay off the cracks.</div>';
      op = Math.min(1, (5 - s.time) / 1.5);
    }
    if (msg !== lastMsg) { lastMsg = msg; msgEl.innerHTML = msg; }
    msgEl.style.opacity = msg ? op.toFixed(3) : '0';

    renderer.render(scene, camera);
  }

  // ---------- resize ----------
  window.addEventListener('resize', function () {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    if (DEMO && state) render();
  });

  // ---------- demo driver ----------
  const demo = { run: 0, steps: 0 };
  function runDemo(t) {
    const target = Math.round(t * 60);
    if (!state || target < demo.steps) {
      demo.run = 0;
      demo.steps = 0;
      resetGame(DEMO_SEED);
    }
    while (demo.steps < target) {
      step(autopilot(state));
      demo.steps++;
      if (state.mode === 'falling' && state.fallT >= 2.6) {
        demo.run++;
        resetGame(DEMO_SEED + demo.run * 7919);
      }
    }
    render();
    window.__demoReady = true;
  }

  if (DEMO) {
    window.renderAt = function (t) { demoT = Math.max(0, +t || 0); runDemo(demoT); };
    window.addEventListener('hashchange', function () {
      const t = parseT();
      if (t === null) { location.reload(); return; }
      demoT = t;
      runDemo(t);
    });
    runDemo(demoT);
    return;
  }

  // ---------- interactive play ----------
  window.addEventListener('hashchange', function () { if (parseT() !== null) location.reload(); });
  const keys = {};
  let touchSteer = 0;
  window.addEventListener('keydown', function (e) {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Space' && state.mode === 'falling' && state.fallT > 0.4) resetGame(newSeed());
  });
  window.addEventListener('keyup', function (e) { keys[e.code] = false; });
  window.addEventListener('blur', function () { for (const k in keys) keys[k] = false; touchSteer = 0; });
  renderer.domElement.addEventListener('pointerdown', function (e) {
    if (state.mode === 'falling') { if (state.fallT > 0.4) resetGame(newSeed()); return; }
    touchSteer = e.clientX < window.innerWidth / 2 ? 1 : -1;
  });
  window.addEventListener('pointerup', function () { touchSteer = 0; });
  window.addEventListener('pointercancel', function () { touchSteer = 0; });

  function playInput() {
    let v = touchSteer;
    if (keys.ArrowLeft || keys.KeyA) v += 1;
    if (keys.ArrowRight || keys.KeyD) v -= 1;
    return Math.max(-1, Math.min(1, v));
  }

  resetGame(newSeed());
  let last = null, acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (last === null) last = now;
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    let n = 0;
    while (acc >= DT && n < 8) { step(playInput()); acc -= DT; n++; }
    if (n === 8) acc = 0;
    render();
  }
  requestAnimationFrame(frame);
})();
</script>
