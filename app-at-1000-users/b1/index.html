<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What happens when 1,000 people open my app</title>
<style>
  html, body { margin: 0; background: #0f1218; color: #e8ecf2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wrap { max-width: 900px; margin: 0 auto; padding: 8px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 12px; background: #0f1218; }
  #controls { display: grid; gap: 14px; padding: 14px 6px 24px; }
  .row { display: grid; gap: 6px; }
  .row label { font-size: 18px; display: flex; justify-content: space-between; }
  .row label b { font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 32px; accent-color: #4ea1ff; }
  .switch { display: flex; align-items: center; gap: 12px; font-size: 18px; cursor: pointer; }
  .switch input { width: 26px; height: 26px; accent-color: #ff4d4d; }
  button { font-size: 18px; padding: 12px 16px; border-radius: 10px; border: 0; background: #4ea1ff; color: #0f1218; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="controls">
    <div class="row">
      <label for="people">People on the site <b id="peopleVal"></b></label>
      <input id="people" type="range" min="10" max="3000" step="10" value="1000">
    </div>
    <div class="row">
      <label for="query">One database query takes <b id="queryVal"></b></label>
      <input id="query" type="range" min="10" max="2000" step="10" value="500">
    </div>
    <label class="switch"><input id="refresh" type="checkbox"> People hit refresh when the page takes more than 5 seconds</label>
    <button id="tour">Play the auto tour (30 s)</button>
  </div>
</div>
<script>
(function () {
  "use strict";

  // ---------- model constants ----------
  var DT = 0.01;            // simulation step, seconds
  var CONNS = 100;          // Postgres default max_connections
  var PATIENCE = 5;         // seconds before a person hits refresh
  var THINK_MIN = 3, THINK_MAX = 7; // seconds a person reads a page before the next click
  var TOUR_END = 30;

  function tourPeople(t) { return t < 3 ? 50 : (t < 13 ? 1000 : 50); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- simulation ----------
  function Sim(queryMs, refresh) {
    this.q = queryMs / 1000;
    this.refresh = refresh;
    this.rng = mulberry32(20261125);
    this.step = 0;
    this.t = 0;
    this.persons = [];
    this.queue = [];
    this.qh = 0;
    this.ghostQ = 0;
    this.conns = new Array(CONNS);
    for (var i = 0; i < CONNS; i++) this.conns[i] = null;
    this.delivered = [];  // [time, wait]
    this.hist = [];
    this.wasted = 0;
    this.refreshes = 0;
    this.served = 0;
    this.started = false;
  }

  Sim.prototype.think = function () { return THINK_MIN + this.rng() * (THINK_MAX - THINK_MIN); };

  Sim.prototype.setPeople = function (n, steady) {
    var ps = this.persons;
    while (ps.length < n) {
      // steady: already browsing, spread over a reading cycle; otherwise: they all open it within half a second
      var timer = steady ? this.rng() * THINK_MAX : this.rng() * 0.5;
      ps.push({ alive: true, state: 0, timer: timer, first: 0, reqStart: 0, req: null });
    }
    while (ps.length > n) {
      var p = ps.pop();
      p.alive = false;
      if (p.state === 1 && p.req && !p.req.ghost) this.ghost(p.req); // they left; the server still runs their query
    }
  };

  Sim.prototype.ghost = function (req) {
    req.ghost = true;
    if (req.inQ) this.ghostQ++;
  };

  Sim.prototype.issue = function (p) {
    var req = { p: p, ghost: false, inQ: true, born: this.t };
    p.req = req;
    p.reqStart = this.t;
    p.state = 1;
    this.queue.push(req);
  };

  Sim.prototype.tick = function (target) {
    if (!this.started) { this.setPeople(target, true); this.started = true; }
    else if (target !== this.persons.length) this.setPeople(target, false);

    this.step++;
    this.t = this.step * DT;
    var t = this.t, ps = this.persons, i, p;

    for (i = 0; i < ps.length; i++) {
      p = ps[i];
      if (p.state === 0) {
        p.timer -= DT;
        if (p.timer <= 1e-9) { p.first = t; this.issue(p); }
      } else if (this.refresh && t - p.reqStart >= PATIENCE - 1e-9) {
        this.ghost(p.req);
        this.refreshes++;
        this.issue(p);
      }
    }

    for (i = 0; i < CONNS; i++) {
      var c = this.conns[i];
      if (!c) continue;
      c.rem -= DT;
      if (c.rem <= 1e-9) {
        var req = c.req;
        if (req.ghost) this.wasted++;
        else {
          p = req.p;
          this.delivered.push([t, t - p.first]);
          this.served++;
          p.state = 0; p.req = null; p.timer = this.think();
        }
        this.conns[i] = null;
      }
    }

    for (i = 0; i < CONNS; i++) {
      if (this.conns[i]) continue;
      if (this.qh >= this.queue.length) break;
      var r = this.queue[this.qh++];
      r.inQ = false;
      if (r.ghost) this.ghostQ--;
      this.conns[i] = { req: r, rem: this.q, dur: this.q };
    }
    if (this.qh > 4096) { this.queue = this.queue.slice(this.qh); this.qh = 0; }

    while (this.delivered.length && this.delivered[0][0] <= t - 1) this.delivered.shift();

    if (this.step % 10 === 0) {
      var s = this.stats();
      this.hist.push({ t: t, people: ps.length, queue: s.queue, busy: s.busy, wait: s.wait });
    }
  };

  Sim.prototype.stats = function () {
    var busy = 0, ghostBusy = 0, i;
    for (i = 0; i < CONNS; i++) if (this.conns[i]) { busy++; if (this.conns[i].req.ghost) ghostBusy++; }
    var longest = 0, ps = this.persons;
    for (i = 0; i < ps.length; i++) if (ps[i].state === 1) { var w = this.t - ps[i].first; if (w > longest) longest = w; }
    var wait;
    if (this.delivered.length) {
      var ws = this.delivered.map(function (d) { return d[1]; }).sort(function (a, b) { return a - b; });
      wait = ws[Math.floor(ws.length / 2)];
      // if nothing got out recently but people are stuck, the page wait is at least the current longest
    } else wait = longest;
    return {
      queue: this.queue.length - this.qh, ghostQ: this.ghostQ,
      busy: busy, ghostBusy: ghostBusy, wait: wait, longest: longest
    };
  };

  // ---------- URL ----------
  function params() {
    var s = (location.hash || "").replace(/^#/, "") + "&" + (location.search || "").replace(/^\?/, "");
    var o = {};
    s.split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      if (i < 0) o[kv] = ""; else o[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
    });
    return o;
  }

  // ---------- UI ----------
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W = 900, H = 1150;
  var elPeople = document.getElementById("people"), elQuery = document.getElementById("query");
  var elRefresh = document.getElementById("refresh"), elTour = document.getElementById("tour");
  var elPV = document.getElementById("peopleVal"), elQV = document.getElementById("queryVal");

  function sizeCanvas() {
    var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var mode = "tour"; // "tour" (real time), "live", "frame"
  var sim = null, frameT = 0, liveTarget = 1000;

  function fmtS(x) { return x < 10 ? x.toFixed(1) : String(Math.round(x)); }
  function fmtN(n) { return Math.round(n).toLocaleString("en-US"); }

  function syncLabels() {
    elPV.textContent = fmtN(+elPeople.value);
    elQV.textContent = (+elQuery.value) + " ms";
  }

  function newSim() { return new Sim(+elQuery.value, elRefresh.checked); }

  function currentTarget() {
    if (mode === "live") return liveTarget;
    return tourPeople(sim ? sim.t : 0);
  }

  // ---------- drawing ----------
  var C = { bg: "#0f1218", panel: "#171c25", line: "#2a3140", text: "#e8ecf2", dim: "#8a93a3",
            blue: "#4ea1ff", amber: "#ffb020", red: "#ff4d4d", gray: "#6b7280", green: "#3ddc84" };

  function font(px, w) { return (w || "600") + " " + px + "px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"; }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function tile(x, y, w, h, label, value, unit, color, sub) {
    ctx.fillStyle = C.panel; rr(x, y, w, h, 14); ctx.fill();
    ctx.fillStyle = C.dim; ctx.font = font(20, "600"); ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText(label, x + 16, y + 14);
    ctx.fillStyle = color; ctx.font = font(62, "800");
    ctx.fillText(value, x + 14, y + 44);
    var vw = ctx.measureText(value).width;
    if (unit) { ctx.font = font(26, "700"); ctx.fillText(unit, x + 20 + vw, y + 76); }
    if (sub) { ctx.fillStyle = C.dim; ctx.font = font(18, "500"); ctx.fillText(sub, x + 16, y + h - 30); }
  }

  function draw() {
    var s = sim.stats(), t = sim.t;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

    // header
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = C.text; ctx.font = font(34, "800");
    ctx.fillText("1 server, 1 Postgres, " + fmtN(sim.persons.length) + " people", 30, 52);
    ctx.fillStyle = C.dim; ctx.font = font(22, "600");
    var modeText = mode === "live" ? "live" : "auto tour";
    ctx.fillText("t = " + t.toFixed(1) + " s · " + modeText + " · query " + Math.round(sim.q * 1000) + " ms · refresh " + (sim.refresh ? "on" : "off"), 30, 84);

    // tiles
    var tw = 200, th = 160, ty = 106, gap = 13.33;
    tile(30, ty, tw, th, "On the site", fmtN(sim.persons.length), "", C.text, "people");
    tile(30 + (tw + gap), ty, tw, th, "In line", fmtN(s.queue), "", s.queue > 0 ? (s.queue > 200 ? C.red : C.amber) : C.green,
         s.ghostQ > 0 ? fmtN(s.ghostQ) + " already gone" : "requests waiting");
    tile(30 + 2 * (tw + gap), ty, tw, th, "DB connections", String(s.busy), "/100", s.busy >= CONNS ? C.red : (s.busy > 70 ? C.amber : C.green),
         s.ghostBusy > 0 ? s.ghostBusy + " for people gone" : "in use");
    tile(30 + 3 * (tw + gap), ty, tw, th, "Page wait", fmtS(s.wait), "s", s.wait > PATIENCE ? C.red : (s.wait > 2 ? C.amber : C.green),
         "longest now " + fmtS(s.longest) + " s");

    // pipeline
    var py = 296;
    ctx.fillStyle = C.text; ctx.font = font(24, "700"); ctx.textAlign = "left";
    ctx.fillText("Line at the server", 30, py + 22);
    ctx.fillText("Postgres", 580, py + 22);
    ctx.fillStyle = C.dim; ctx.font = font(17, "500");
    ctx.fillText("default max_connections = 100", 580, py + 46);
    ctx.fillText("front of the line is on the right →", 30, py + 46);

    var qx = 30, qy = py + 62, qw = 500, qh = 330;
    ctx.fillStyle = C.panel; rr(qx, qy, qw, qh, 12); ctx.fill();
    var n = s.queue;
    if (n > 0) {
      var cell = Math.floor(Math.sqrt((qw - 16) * (qh - 16) / n));
      cell = Math.max(4, Math.min(24, cell));
      var cols = Math.floor((qw - 16) / cell), rows = Math.floor((qh - 16) / cell);
      var cap = cols * rows, shown = Math.min(n, cap);
      var r = Math.max(1.2, cell * 0.38);
      for (var i = 0; i < shown; i++) {
        var req = sim.queue[sim.qh + i];
        var col = Math.floor(i / rows), row = i % rows;
        var x = qx + qw - 8 - (col + 0.5) * cell, y = qy + 8 + (row + 0.5) * cell;
        var age = t - (req.ghost ? req.born : req.p.first);
        ctx.fillStyle = req.ghost ? C.gray : (age > PATIENCE ? C.red : (age > 2 ? C.amber : C.blue));
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      if (n > shown) {
        ctx.fillStyle = "rgba(15,18,24,0.85)"; rr(qx + 12, qy + qh - 52, 230, 40, 8); ctx.fill();
        ctx.fillStyle = C.text; ctx.font = font(22, "700");
        ctx.fillText("+" + fmtN(n - shown) + " more", qx + 24, qy + qh - 24);
      }
    } else {
      ctx.fillStyle = C.green; ctx.font = font(28, "700"); ctx.textAlign = "center";
      ctx.fillText("nobody waiting", qx + qw / 2, qy + qh / 2 + 10);
      ctx.textAlign = "left";
    }

    // arrow
    ctx.strokeStyle = C.dim; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(538, qy + qh / 2); ctx.lineTo(568, qy + qh / 2); ctx.stroke();
    ctx.fillStyle = C.dim; ctx.beginPath();
    ctx.moveTo(574, qy + qh / 2); ctx.lineTo(562, qy + qh / 2 - 9); ctx.lineTo(562, qy + qh / 2 + 9); ctx.fill();

    // DB grid
    var gx = 580, gy = qy, gs = 29;
    ctx.fillStyle = C.panel; rr(gx - 6, gy - 6, gs * 10 + 12, gs * 10 + 12, 12); ctx.fill();
    for (var k = 0; k < CONNS; k++) {
      var cx = gx + (k % 10) * gs + 2, cy = gy + Math.floor(k / 10) * gs + 2, cs = gs - 4;
      var c = sim.conns[k];
      ctx.strokeStyle = C.line; ctx.lineWidth = 2;
      rr(cx, cy, cs, cs, 4); ctx.stroke();
      if (c) {
        var frac = c.dur > 0 ? Math.min(1, Math.max(0, 1 - c.rem / c.dur)) : 1;
        ctx.fillStyle = c.req.ghost ? C.gray : C.blue;
        ctx.globalAlpha = 0.35; rr(cx, cy, cs, cs, 4); ctx.fill();
        ctx.globalAlpha = 1;
        var fh = Math.max(2, cs * frac);
        ctx.fillRect(cx, cy + cs - fh, cs, fh);
      }
    }
    ctx.fillStyle = s.busy >= CONNS ? C.red : C.text; ctx.font = font(22, "700");
    ctx.fillText(s.busy >= CONNS ? "all 100 busy" : (CONNS - s.busy) + " free", gx, gy + gs * 10 + 30);

    // legend
    var ly = qy + qh + 30;
    var leg = [[C.blue, "waiting < 2 s"], [C.amber, "2–5 s"], [C.red, "> 5 s"], [C.gray, "person already gone"]];
    var lx = 30; ctx.font = font(18, "600");
    leg.forEach(function (l) {
      ctx.fillStyle = l[0]; ctx.beginPath(); ctx.arc(lx + 8, ly - 6, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.dim; ctx.fillText(l[1], lx + 22, ly);
      lx += 30 + ctx.measureText(l[1]).width + 14;
    });

    drawChart(t);

    // footer
    ctx.fillStyle = C.text; ctx.font = font(20, "600"); ctx.textAlign = "left";
    ctx.fillText("Pages served " + fmtN(sim.served) + " · refreshes " + fmtN(sim.refreshes) +
                 " · queries for people gone " + fmtN(sim.wasted), 30, 1098);
    ctx.fillStyle = C.dim; ctx.font = font(16, "500");
    ctx.fillText("Model: each person reads a page ~5 s, then opens the next. 1 query per page. The app waits for a free", 30, 1124);
    ctx.fillText("connection. A refresh doesn't cancel the old request: the server still runs it.", 30, 1144);
  }

  function drawChart(t) {
    var x0 = 90, x1 = 860, y0 = 760, y1 = 1050;
    ctx.fillStyle = C.text; ctx.font = font(24, "700"); ctx.textAlign = "left";
    ctx.fillText("How long a person waits for the page", 30, y0 - 22);

    var tMin, tMax;
    if (mode === "live") { tMax = Math.max(TOUR_END, t); tMin = tMax - TOUR_END; }
    else { tMin = 0; tMax = TOUR_END; }
    var pts = sim.hist.filter(function (h) { return h.t >= tMin && h.t <= tMax; });

    var peak = 10, maxP = 100;
    pts.forEach(function (h) { if (h.wait > peak) peak = h.wait; if (h.people > maxP) maxP = h.people; });
    var yMax = peak <= 10 ? 10 : Math.ceil(peak / 5) * 5;
    function X(tt) { return x0 + (tt - tMin) / (tMax - tMin) * (x1 - x0); }
    function Y(v) { return y1 - v / yMax * (y1 - y0); }

    ctx.fillStyle = C.panel; rr(x0 - 4, y0 - 4, x1 - x0 + 8, y1 - y0 + 8, 8); ctx.fill();

    // people area
    if (pts.length > 1) {
      ctx.fillStyle = "rgba(78,161,255,0.13)";
      ctx.beginPath(); ctx.moveTo(X(pts[0].t), y1);
      pts.forEach(function (h) { ctx.lineTo(X(h.t), y1 - h.people / maxP * (y1 - y0) * 0.9); });
      ctx.lineTo(X(pts[pts.length - 1].t), y1); ctx.closePath(); ctx.fill();
    }

    // grid + y labels
    ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.font = font(18, "600"); ctx.fillStyle = C.dim; ctx.textAlign = "right";
    var stepY = yMax <= 10 ? 2 : (yMax <= 30 ? 5 : Math.ceil(yMax / 6 / 5) * 5);
    for (var v = 0; v <= yMax + 1e-9; v += stepY) {
      ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x1, Y(v)); ctx.stroke();
      ctx.fillText(v + " s", x0 - 10, Y(v) + 6);
    }
    ctx.textAlign = "center";
    for (var tt = Math.ceil(tMin / 5) * 5; tt <= tMax + 1e-9; tt += 5) ctx.fillText(Math.round(tt) + "s", X(tt), y1 + 26);

    // 5 s line
    ctx.strokeStyle = C.red; ctx.setLineDash([8, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, Y(PATIENCE)); ctx.lineTo(x1, Y(PATIENCE)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C.red; ctx.textAlign = "left"; ctx.font = font(17, "700");
    ctx.fillText("5 s: people give up / refresh", x0 + 8, Y(PATIENCE) - 8);

    // tour phase marks
    if (mode !== "live") {
      ctx.fillStyle = C.dim; ctx.font = font(16, "600"); ctx.textAlign = "center";
      ctx.strokeStyle = "rgba(138,147,163,0.5)"; ctx.lineWidth = 1;
      [[3, "1,000 arrive"], [13, "back to 50"]].forEach(function (m) {
        ctx.beginPath(); ctx.moveTo(X(m[0]), y0); ctx.lineTo(X(m[0]), y1); ctx.stroke();
        ctx.fillText(m[1], X(m[0]) + 50, y0 + 20);
      });
    }

    // wait line
    if (pts.length > 1) {
      ctx.strokeStyle = C.amber; ctx.lineWidth = 4; ctx.lineJoin = "round";
      ctx.beginPath();
      pts.forEach(function (h, i) { var yy = Y(Math.min(h.wait, yMax)); if (i) ctx.lineTo(X(h.t), yy); else ctx.moveTo(X(h.t), yy); });
      ctx.stroke();
    }
    // now marker
    if (t >= tMin && t <= tMax) {
      ctx.strokeStyle = C.text; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(X(t), y0); ctx.lineTo(X(t), y1); ctx.stroke();
    }
    ctx.textAlign = "right"; ctx.fillStyle = "rgba(78,161,255,0.9)"; ctx.font = font(16, "600");
    ctx.fillText("shaded: people on the site (peak " + fmtN(maxP) + ")", x1 - 6, y1 - 10);
    ctx.textAlign = "left";
  }

  // ---------- modes ----------
  function renderFrame() {
    var p = params();
    var target = Math.max(0, Math.min(TOUR_END, parseFloat(p.t) || 0));
    var steps = Math.round(target / DT);
    var q = +elQuery.value, rf = elRefresh.checked;
    if (!sim || sim.step > steps || sim.q !== q / 1000 || sim.refresh !== rf || mode !== "frame") {
      sim = new Sim(q, rf);
    }
    mode = "frame";
    while (sim.step < steps) sim.tick(tourPeople(sim.step * DT));
    if (!sim.started) sim.tick === sim.tick, sim.setPeople(tourPeople(0), true), sim.started = true;
    frameT = target;
    elPeople.value = tourPeople(target); syncLabels();
    draw();
  }

  var last = 0, acc = 0;
  function loop(ts) {
    if (mode === "frame") return;
    if (!last) last = ts;
    var dt = Math.min(0.25, (ts - last) / 1000); last = ts;
    acc += dt;
    var n = 0;
    while (acc >= DT && n < 40) {
      var target = mode === "live" ? liveTarget : tourPeople(sim.step * DT);
      sim.tick(target);
      acc -= DT; n++;
      if (mode === "tour" && sim.t >= TOUR_END - 1e-9) {
        mode = "live"; liveTarget = tourPeople(sim.t); elPeople.value = liveTarget; syncLabels();
      }
    }
    if (n >= 40) acc = 0;
    if (mode === "tour") { elPeople.value = tourPeople(sim.t); syncLabels(); }
    draw();
    requestAnimationFrame(loop);
  }

  function startTour() {
    mode = "tour"; sim = newSim(); last = 0; acc = 0;
    if (location.hash && /t=/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
    requestAnimationFrame(loop);
  }

  function isFrameUrl() { var p = params(); return p.t !== undefined && p.t !== ""; }

  // ---------- init ----------
  sizeCanvas();
  (function initFromUrl() {
    var p = params();
    if (p.refresh === "1") elRefresh.checked = true;
    if (p.refresh === "0") elRefresh.checked = false;
    if (p.q && !isNaN(+p.q)) elQuery.value = Math.max(10, Math.min(2000, +p.q));
  })();
  syncLabels();

  elPeople.addEventListener("input", function () {
    syncLabels();
    liveTarget = +elPeople.value;
    if (mode !== "live") {
      var wasFrame = mode === "frame";
      mode = "live";
      if (wasFrame) { history.replaceState(null, "", location.pathname + location.search); }
      last = 0; acc = 0; requestAnimationFrame(loop);
    }
  });
  elQuery.addEventListener("input", function () {
    syncLabels();
    if (mode === "frame") { sim = null; renderFrame(); return; }
    sim.q = +elQuery.value / 1000;
  });
  elRefresh.addEventListener("change", function () {
    if (mode === "frame") { sim = null; renderFrame(); return; }
    sim.refresh = elRefresh.checked;
  });
  elTour.addEventListener("click", startTour);
  window.addEventListener("hashchange", function () { if (isFrameUrl()) renderFrame(); });

  if (isFrameUrl()) renderFrame();
  else { sim = newSim(); startTour(); }
})();
</script>
</body>
</html>
